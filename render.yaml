services:
  - type: web
    name: igtihad-api
    env: node
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 10000
      - key: CLIENT_URL
        value: https://igtihad.netlify.app # سيتم تغييره لاحقاً برابط الفرونت إند الحقيقي
